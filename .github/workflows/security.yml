name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.28"
          uv sync --locked --python 3.13 --all-extras --dev

      - name: Run pip-audit
        run: uv run pip-audit

  bandit:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked analysis environment
        run: |
          python -m pip install "uv==0.11.28"
          uv sync --locked --python 3.13 --all-extras --dev

      - name: Run bandit
        run: uv run bandit -r src/ojs -c pyproject.toml

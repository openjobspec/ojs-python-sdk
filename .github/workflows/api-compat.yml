name: API Compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  griffe:
    name: Python API Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.28"
          uv sync --locked --python 3.13 --all-extras --dev

      - name: Build and validate shipped package
        run: |
          uv build
          uv venv .api-compat-venv --python 3.13
          uv pip install --python .api-compat-venv/bin/python dist/*.whl
          .api-compat-venv/bin/python -c "import importlib.metadata as m, ojs; assert m.version('openjobspec') == ojs.__version__; missing = [name for name in ojs.__all__ if not hasattr(ojs, name)]; assert not missing, missing"
          if .api-compat-venv/bin/python -c "import openjobspec" 2>/dev/null; then
            echo "::error::Wheel unexpectedly ships the duplicate openjobspec package."
            exit 1
          fi

      - name: Check for breaking changes
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          uv run griffe check -s src ojs --against "$BASE_REF" --format github

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.28"
          uv sync --locked --python "${{ matrix.python-version }}" --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest --cov=ojs --cov-report=term-missing --cov-report=xml

  wheel-imports:
    name: Wheel ${{ matrix.install-mode }} imports (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        install-mode: ["base", "all"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==0.11.28"

      - name: Build wheel
        run: uv build --wheel --build-constraints build-constraints.txt

      - name: Validate publish payload
        if: matrix.python-version == '3.13' && matrix.install-mode == 'base'
        run: uv publish --dry-run --trusted-publishing never dist/*

      - name: Install wheel
        run: |
          uv venv .wheel-smoke --python "${{ matrix.python-version }}"
          WHEEL=$(find dist -name '*.whl' -print -quit)
          if [ "${{ matrix.install-mode }}" = "all" ]; then
            uv pip install --python .wheel-smoke/bin/python "${WHEEL}[all]"
          else
            uv pip install --python .wheel-smoke/bin/python "$WHEEL"
          fi

      - name: Verify imports
        run: |
          .wheel-smoke/bin/python -c "import sys, ojs; assert 'cryptography' not in sys.modules; assert ojs.Client and ojs.Worker"
          if [ "${{ matrix.install-mode }}" = "all" ]; then
            .wheel-smoke/bin/python -c "import azure.functions, cryptography, grpc, opentelemetry, ojs.encryption, ojs.otel, ojs.serverless, ojs.transport.grpc"
          fi

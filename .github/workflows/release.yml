name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install "uv==0.11.28"

      - name: Install locked development environment
        run: uv sync --locked --python 3.12 --all-extras --dev

      - name: Build twice and verify reproducibility
        run: uv run python tools/check_reproducible_build.py --output-dir dist

      - name: Verify artifact version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c "from email.parser import BytesParser; from pathlib import Path; import os, zipfile; expected = os.environ['RELEASE_TAG'].removeprefix('v'); wheel = next(Path('dist').glob('*.whl')); archive = zipfile.ZipFile(wheel); metadata = next(name for name in archive.namelist() if name.endswith('.dist-info/METADATA')); actual = BytesParser().parsebytes(archive.read(metadata))['Version']; assert actual == expected, f'{actual} != {expected}'"

      - name: Smoke-test built wheel
        run: |
          uv venv .release-smoke --python 3.12
          WHEEL=$(find dist -name '*.whl' -print -quit)
          uv pip install --python .release-smoke/bin/python "${WHEEL}[all]"
          .release-smoke/bin/python -c "import azure.functions, cryptography, grpc, importlib.metadata as m, ojs, ojs.encryption, ojs.otel, ojs.serverless, ojs.transport.grpc; assert m.version('openjobspec') == ojs.__version__"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b54f72e44f89ce851e7d6b7d # release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          generate_release_notes: true
          files: dist/*

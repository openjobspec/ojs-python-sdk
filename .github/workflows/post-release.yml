name: Post-release registry verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released package version (without a leading v)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI consumer / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$MANUAL_VERSION"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install released package from PyPI
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install "uv==0.11.28"
          uv venv .registry-smoke --python "${{ matrix.python-version }}"
          uv pip install --python .registry-smoke/bin/python "openjobspec==${RELEASE_VERSION}"

      - name: Verify version and clean base import
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .registry-smoke/bin/python -c "import importlib.metadata as m, os, ojs; assert m.version('openjobspec') == ojs.__version__ == os.environ['RELEASE_VERSION']"
